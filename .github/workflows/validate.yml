name: Starter kit validation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run zero-dependency tests
        run: npm test
